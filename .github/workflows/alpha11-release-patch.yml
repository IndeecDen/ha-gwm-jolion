name: Alpha 11 release patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update alpha.11 metadata and docs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = "0.1.0-alpha.11"

          const_path = Path("custom_components/gwm_jolion/const.py")
          text = const_path.read_text(encoding="utf-8")
          text = text.replace('VERSION = "0.1.0-alpha.10"', f'VERSION = "{version}"', 1)
          const_path.write_text(text, encoding="utf-8")

          manifest_path = Path("custom_components/gwm_jolion/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")
          text = text.replace("Текущая версия — **0.1.0-alpha.10**.", f"Текущая версия — **{version}**.", 1)
          readme_path.write_text(text, encoding="utf-8")

          roadmap_path = Path("ROADMAP.md")
          text = roadmap_path.read_text(encoding="utf-8")
          text = text.replace(
              "- 🧪 `vehicleBasicsInfo`;\n- ✅ безопасная диагностика ответа `vehicleBasicsInfo` без публикации значений;",
              "- 🟢 `vehicleBasicsInfo`;\n- ✅ разбор российского ответа `vehicleBasicsInfo` с вложенностью `data → config`;\n- ✅ безопасный whitelist snapshot полезных climate/comfort значений без VIN, user ID и других идентификаторов;",
              1,
          )
          old_version = "### `0.1.0-alpha.10` — Reliability\n\nНадёжность удалённых команд, remote-start guard, reauth и понятные состояния выполнения без добавления новых payload автомобиля."
          new_version = "### `0.1.0-alpha.11` — vehicleBasicsInfo\n\nИсправлен разбор `vehicleBasicsInfo → data → config`. Диагностика теперь сохраняет только разрешённые climate/comfort значения, включая параметры сидений, defrost, `skyLight` и `shadeScreen`, без чувствительных идентификаторов. Новых remote payload автомобиля нет.\n\n### `0.1.0-alpha.10` — Reliability\n\nНадёжность удалённых команд, remote-start guard, reauth и понятные состояния выполнения без добавления новых payload автомобиля."
          if old_version not in text:
              raise SystemExit("ROADMAP version marker not found")
          text = text.replace(old_version, new_version, 1)
          roadmap_path.write_text(text, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          text = changelog_path.read_text(encoding="utf-8")
          section = """## 0.1.0-alpha.11

Исправление разбора `vehicleBasicsInfo` для российского GWM Cloud без добавления новых команд автомобилю.

### Диагностика / API

- поддержана фактическая вложенность ответа `data → config`;
- безопасный snapshot теперь может включать полезные параметры климата, сидений, окон, defrost, `skyLight`, `shadeScreen` и таймеры comfort-функций;
- VIN, `userId`, подписка и неизвестные поля по-прежнему не попадают в whitelist snapshot;
- live-телеметрия подогрева сидений остаётся приоритетной, значения `vehicleBasicsInfo` используются только как fallback;
- `skyLight` и `shadeScreen` сохраняются как raw diagnostics без предположения о значении enum;
- добавлены unit-тесты для реальной структуры российского ответа и защиты от утечки неизвестных полей;
- remote payload и встроенная карточка в этой версии не изменялись.

"""
          if not text.startswith("# Changelog\n"):
              raise SystemExit("CHANGELOG header not found")
          if "## 0.1.0-alpha.11" not in text:
              text = text.replace("# Changelog\n\n", "# Changelog\n\n" + section, 1)
          changelog_path.write_text(text, encoding="utf-8")
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha11-release-patch.yml
          git add custom_components/gwm_jolion/const.py \
                  custom_components/gwm_jolion/manifest.json \
                  README.md ROADMAP.md CHANGELOG.md
          git commit -m "0.1.0-alpha.11 — parse vehicleBasics data.config"
          git push
