name: Temporary alpha19.7 patch runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpha19-7-apply-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/protocol-field-results-alpha19-7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply alpha19.7 changes to PR branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text, encoding='utf-8')

          def prepend_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}: {anchor!r}')
              text = text.replace(anchor, anchor + addition, 1)
              p.write_text(text, encoding='utf-8')

          version_old = '0.1.0-alpha.19.6'
          version_new = '0.1.0-alpha.19.7'

          replace('custom_components/gwm_jolion/const.py', f'VERSION = "{version_old}"', f'VERSION = "{version_new}"')
          replace('custom_components/gwm_jolion/manifest.json', f'"version": "{version_old}"', f'"version": "{version_new}"')
          replace('custom_components/gwm_jolion/__init__.py', f'?v={version_old}', f'?v={version_new}')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js', version_old, version_new)

          replace('custom_components/gwm_jolion/protocol.py',
              '    "2210001": SignalInfo("2210001", "window_2210001_raw", "Окно 2210001", VerificationStatus.CONFIRMED, "1=closed, 0=open; позиция требует дополнительной сверки"),\n'
              '    "2210002": SignalInfo("2210002", "window_2210002_raw", "Окно 2210002", VerificationStatus.CONFIRMED, "1=closed, 0=open; позиция требует дополнительной сверки"),\n'
              '    "2210003": SignalInfo("2210003", "window_2210003_raw", "Окно 2210003", VerificationStatus.CONFIRMED, "1=closed, 0=open; позиция требует дополнительной сверки"),\n'
              '    "2210004": SignalInfo("2210004", "window_2210004_raw", "Окно 2210004", VerificationStatus.CONFIRMED, "1=closed, 0=open; позиция требует дополнительной сверки"),',
              '    "2210001": SignalInfo("2210001", "window_2210001_raw", "Окно переднее левое / водительское", VerificationStatus.CONFIRMED, "field marker: FL; 1=closed, 3=partial, 2=full open"),\n'
              '    "2210002": SignalInfo("2210002", "window_2210002_raw", "Окно переднее правое", VerificationStatus.CONFIRMED, "field marker: FR; 1=closed, 2=full open captured; 3 belongs to non-closed multistate family but was not isolated in this run"),\n'
              '    "2210003": SignalInfo("2210003", "window_2210003_raw", "Окно заднее левое", VerificationStatus.CONFIRMED, "field marker: RL; 1=closed, 2=full open captured; 3 belongs to non-closed multistate family but was not isolated in this run"),\n'
              '    "2210004": SignalInfo("2210004", "window_2210004_raw", "Окно заднее правое", VerificationStatus.CONFIRMED, "field marker: RR; 1=closed, 2=full open captured; 3 belongs to non-closed multistate family but was not isolated in this run"),')
          replace('custom_components/gwm_jolion/protocol.py',
              '    "2202001": SignalInfo("2202001", "climate_raw", "Состояние климатической системы", VerificationStatus.EXPERIMENTAL, "Предполагается 0=OFF, 1=ON"),',
              '    "2202001": SignalInfo("2202001", "climate_raw", "Состояние климатической системы", VerificationStatus.CONFIRMED, "field markers confirm 0=OFF, 1=ON; ACC/front-defrost can activate climate, therefore this is not an ignition/ACC signal"),')
          replace('custom_components/gwm_jolion/protocol.py',
              '    "2220001": SignalInfo("2220001", "driver_seat_heat_level_raw", "Уровень подогрева водительского сиденья", VerificationStatus.KNOWN_UNVERIFIED),\n'
              '    "2220002": SignalInfo("2220002", "passenger_seat_heat_level_raw", "Уровень подогрева пассажирского сиденья", VerificationStatus.KNOWN_UNVERIFIED),',
              '    "2220001": SignalInfo("2220001", "driver_seat_heat_level_raw", "Уровень подогрева водительского сиденья", VerificationStatus.CONFIRMED, "0=off, 1=low, 2=medium, 3=high"),\n'
              '    "2220002": SignalInfo("2220002", "passenger_seat_heat_level_raw", "Уровень подогрева пассажирского сиденья", VerificationStatus.CONFIRMED, "0=off, 1=low, 2=medium, 3=high"),')
          replace('custom_components/gwm_jolion/protocol.py',
              '    "2204008": SignalInfo("2204008", "light_2204008_raw", "Неопределённый световой статус 2204008", VerificationStatus.UNKNOWN),',
              '    "2204008": SignalInfo("2204008", "light_2204008_raw", "Кандидат статуса дальнего света 2204008", VerificationStatus.KNOWN_UNVERIFIED, "LIGHT_HIGH marker was followed by 0→1 and later 1→0; repeat isolated light test before treating as confirmed"),')

          window_raw_anchor = '    "2210010": SensorDef("window_learn_2210010_raw", "Обучение стекла 2210010 (raw)", icon="mdi:car-door", code="2210010", diagnostic=True),'
          window_raw_add = (
              '    "2210001": SensorDef("window_2210001_raw", "Окно переднее левое (raw)", icon="mdi:car-door", code="2210001", diagnostic=True),\n'
              '    "2210002": SensorDef("window_2210002_raw", "Окно переднее правое (raw)", icon="mdi:car-door", code="2210002", diagnostic=True),\n'
              '    "2210003": SensorDef("window_2210003_raw", "Окно заднее левое (raw)", icon="mdi:car-door", code="2210003", diagnostic=True),\n'
              '    "2210004": SensorDef("window_2210004_raw", "Окно заднее правое (raw)", icon="mdi:car-door", code="2210004", diagnostic=True),\n'
          )
          replace('custom_components/gwm_jolion/const.py', window_raw_anchor, window_raw_add + window_raw_anchor)
          replace('custom_components/gwm_jolion/const.py',
              '    "2204008": SensorDef("light_2204008_raw", "Свет 2204008 (raw, неизвестно)", icon="mdi:car-light-alert", code="2204008", diagnostic=True),',
              '    "2204008": SensorDef("light_2204008_raw", "Дальний свет 2204008 (raw, кандидат)", icon="mdi:car-light-high", code="2204008", diagnostic=True),')
          replace('custom_components/gwm_jolion/const.py',
              '    ("window_2210001_open", "Окно 2210001", "window", True),\n'
              '    ("window_2210002_open", "Окно 2210002", "window", True),\n'
              '    ("window_2210003_open", "Окно 2210003", "window", True),\n'
              '    ("window_2210004_open", "Окно 2210004", "window", True),',
              '    ("window_2210001_open", "Окно переднее левое", "window", True),\n'
              '    ("window_2210002_open", "Окно переднее правое", "window", True),\n'
              '    ("window_2210003_open", "Окно заднее левое", "window", True),\n'
              '    ("window_2210004_open", "Окно заднее правое", "window", True),')

          replace('custom_components/gwm_jolion/helpers.py',
              '    Raw 1 is closed. Raw 2 and 3 are non-closed states. Exact physical meaning\n'
              '    of 2 vs 3 is confirmed for 2210001 only and is intentionally not encoded\n'
              '    into the generic binary sensor.',
              '    Raw 1 is closed. Raw 2 and 3 are non-closed states. Physical positions of\n'
              '    2210001..2210004 are field-confirmed; exact 2-vs-3 intermediate semantics\n'
              '    were isolated for 2210001 only, so the generic binary sensor stays conservative.')

          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '    window1: "_window_2210001_open",\n'
              '    window1Raw: "_window_2210001_raw",',
              '    window1: "_window_2210001_open",\n'
              '    window1Raw: "_window_2210001_raw",\n'
              '    window2: "_window_2210002_open",\n'
              '    window2Raw: "_window_2210002_raw",\n'
              '    window3: "_window_2210003_open",\n'
              '    window3Raw: "_window_2210003_raw",\n'
              '    window4: "_window_2210004_open",\n'
              '    window4Raw: "_window_2210004_raw",')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '    _doorState(key) {',
              '    _windowVisual(openKey, rawKey) {\n'
              '      const rawLevel = this._windowLevel(this._raw(rawKey));\n'
              '      const level = rawLevel === null\n'
              '        ? (this._isUnavailable(openKey) ? null : this._isOn(openKey) ? 1 : 0)\n'
              '        : rawLevel;\n'
              '      return {\n'
              '        level,\n'
              '        open: level !== null && level > 0,\n'
              '        opacity: level === null ? 0.94 : Math.max(0.08, 0.96 - level * 0.88),\n'
              '        scale: level === null ? 1 : Math.max(0.18, 1 - level * 0.76),\n'
              '      };\n'
              '    }\n\n'
              '    _doorState(key) {')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '      const anyWindows = this._isOn("windows");\n\n'
              '      const flWindowLevelRaw = this._windowLevel(this._raw("window1Raw"));\n'
              '      const flWindowLevel = flWindowLevelRaw === null\n'
              '        ? (this._isUnavailable("window1") ? null : this._isOn("window1") ? 1 : 0)\n'
              '        : flWindowLevelRaw;\n'
              '      const flGlassOpacity = flWindowLevel === null ? 0.94 : Math.max(0.08, 0.96 - flWindowLevel * 0.88);\n'
              '      const flGlassScale = flWindowLevel === null ? 1 : Math.max(0.18, 1 - flWindowLevel * 0.76);',
              '      const windowFl = this._windowVisual("window1", "window1Raw");\n'
              '      const windowFr = this._windowVisual("window2", "window2Raw");\n'
              '      const windowRl = this._windowVisual("window3", "window3Raw");\n'
              '      const windowRr = this._windowVisual("window4", "window4Raw");\n'
              '      const anyWindows = this._isOn("windows") || [windowFl, windowFr, windowRl, windowRr].some((item) => item.open);')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '<path class="door-window" d="M435 119 L565 95 L565 151 L435 168 Z"/>',
              '<path class="door-window ${windowFr.open ? "window-open" : ""}" d="M435 119 L565 95 L565 151 L435 168 Z" style="opacity:${windowFr.opacity.toFixed(2)};transform:scaleY(${windowFr.scale.toFixed(2)})"/>')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '<path class="door-window generic-window" d="M625 94 L805 104 L805 158 L625 151 Z"/>',
              '<path class="door-window ${windowRr.open ? "window-open" : ""}" d="M625 94 L805 104 L805 158 L625 151 Z" style="opacity:${windowRr.opacity.toFixed(2)};transform:scaleY(${windowRr.scale.toFixed(2)})"/>', 1)
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '<path class="door-window driver-window" d="M435 401 L565 425 L565 369 L435 352 Z" style="opacity:${flGlassOpacity.toFixed(2)};transform:scaleY(${flGlassScale.toFixed(2)})"/>',
              '<path class="door-window driver-window ${windowFl.open ? "window-open" : ""}" d="M435 401 L565 425 L565 369 L435 352 Z" style="opacity:${windowFl.opacity.toFixed(2)};transform:scaleY(${windowFl.scale.toFixed(2)})"/>')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              '<path class="door-window generic-window" d="M625 426 L805 416 L805 362 L625 369 Z"/>',
              '<path class="door-window ${windowRl.open ? "window-open" : ""}" d="M625 426 L805 416 L805 362 L625 369 Z" style="opacity:${windowRl.opacity.toFixed(2)};transform:scaleY(${windowRl.scale.toFixed(2)})"/>')
          replace('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js', '          .windows-open .generic-window{', '          .door-window.window-open{')

          replace('PROTOCOL.md', '| `2202001` | Климат / активность климатической системы | 🧪 experimental | устойчиво наблюдается `0=OFF`, `1=ON` |', '| `2202001` | Климат / активность климатической системы | ✅ confirmed | marker-тест: `0=OFF`, `1=ON`; не использовать как ACC |')
          replace('PROTOCOL.md',
              '| `2210002` | Позиция уточняется | 🟡 known_unverified | `1=closed`, `2/3=not closed` |\n| `2210003` | Позиция уточняется | 🟡 known_unverified | `1=closed`, `2/3=not closed` |\n| `2210004` | Позиция уточняется | 🟡 known_unverified | `1=closed`, `2/3=not closed` |\n\nДо marker-теста оставшихся трёх окон новые friendly-позиции им не назначаются.',
              '| `2210002` | Переднее правое | ✅ confirmed | `1=closed`, `2=full open` поймано; `3` отдельно не изолировано |\n| `2210003` | Заднее левое | ✅ confirmed | `1=closed`, `2=full open` поймано; `3` отдельно не изолировано |\n| `2210004` | Заднее правое | ✅ confirmed | `1=closed`, `2=full open` поймано; `3` отдельно не изолировано |\n\nФизическая привязка всех четырёх окон подтверждена recovered marker-сессией `alpha.19.5`. Generic binary decoder по-прежнему трактует `2/3` только как «не закрыто», потому что промежуточное значение `3` отдельно поймано для `2210001`.')
          replace('PROTOCOL.md', '| `2204008` | Неизвестный световой статус | ❓ unknown |', '| `2204008` | Кандидат дальнего света | 🟡 known_unverified |')
          replace('PROTOCOL.md', '`2204007/2204008` не управляют анимацией фар карточки до marker-теста LIGHT_OFF/AUTO/PARKING/LOW/HIGH.', 'В marker-тесте `LIGHT_OFF/AUTO/PARKING/LOW` не дали устойчивого изменения `2204007/2204008`, а после `LIGHT_HIGH` код `2204008` изменился `0→1` и позже вернулся `1→0`. Это сильный кандидат на дальний свет, но до отдельного медленного повторного теста он остаётся `known_unverified` и не управляет анимацией фар карточки.')
          replace('PROTOCOL.md', 'В отдельном тесте ACC двигатель оставался `2016001=0`, но GWM начал отдавать свежую телеметрию. Значение `2016001=1` пока не наблюдалось. Отдельный пользовательский sensor ACC пока не создаётся.\n\nПлан marker-теста: `VEHICLE_SLEEP → DOOR_WAKE → IGNITION_ACC → ENGINE_RUNNING → ENGINE_STOPPED → VEHICLE_LOCKED`.', 'Полный marker-тест `VEHICLE_SLEEP → DOOR_WAKE → IGNITION_ACC → ENGINE_RUNNING → ENGINE_STOPPED → VEHICLE_LOCKED` выполнен на реальном Jolion. На `IGNITION_ACC` двигатель остался `2016001=0`, при этом `2202001` стал `1` и cloud telemetry стала свежей. На `ENGINE_RUNNING` получено `2016001: 0→2`, на `ENGINE_STOPPED` — `2→0`. Значение `2016001=1` не наблюдалось, поэтому отдельный пользовательский sensor ACC пока не создаётся. `2202001` является состоянием климата и не должен использоваться как surrogate ACC.')
          prepend_after('PROTOCOL.md', '| `2078020` | Очистка/циркуляция воздуха | 🟡 known_unverified |\n', '\nВ recovered marker-сессии быстрые `STEERING_HEAT_ON/OFF`, `REAR_DEFROST_ON/OFF` и `FRONT_DEFROST_ON/OFF` не показали отдельных кодов `2060016`, `2210032` или `2222001` в 43-item STATUS. Передний defrost при этом активировал общий climate-код `2202001`. Эти comfort-status остаются неподтверждёнными и не должны угадываться по одному `2202001`.\n')

          replace('README.md', 'Текущая версия — **0.1.0-alpha.19.6**.', 'Текущая версия — **0.1.0-alpha.19.7**.')
          replace('README.md', '#### `0.1.0-alpha.19.6` — широкий SUV top-view', '#### `0.1.0-alpha.19.7` — field-tested windows + protocol')
          replace('README.md', 'После проверки `alpha.19.5` на реальной узкой Lovelace-карточке центральная пиктограмма полностью переработана по пропорциям. Раньше кузов был слишком длинным и узким и визуально напоминал лодку. В `alpha.19.6` кузов стал существенно шире, выше и ближе к пропорциям компактного SUV.', 'В `alpha.19.7` сохранён широкий SUV top-view из `alpha.19.6`, а recovered JSONL marker-тест закрепил физическую привязку всех четырёх окон. Карточка теперь получает raw/binary состояния каждого стекла отдельно и может визуально отражать FR/RR/FL/RL без догадок о позиции.')
          replace('README.md', '- подтверждённое водительское окно `2210001` находится на FL и использует шкалу `1=закрыто`, `3=частично`, `2=полностью открыто`;\n- остальные окна до marker-теста не получают выдуманную физическую позицию;\n- фары не связаны с двигателем и ждут физического подтверждения light telemetry;', '- все четыре окна физически закреплены: `2210001=FL`, `2210002=FR`, `2210003=RL`, `2210004=RR`;\n- `2210001` использует полностью пойманную шкалу `1=закрыто`, `3=частично`, `2=полностью открыто`; для остальных окон в recovered run надёжно пойманы `1=closed` и `2=full open`, а generic binary logic по-прежнему безопасно считает `2/3` «не закрыто»;\n- raw-состояния всех четырёх окон доступны как diagnostic sensors и используются соответствующими SVG-стёклами карточки;\n- фары не связаны с двигателем: `2204008` теперь документирован только как кандидат дальнего света после `LIGHT_HIGH`, без автоматической активации до повторной проверки;')
          replace('README.md', 'Для `2210001` физически подтверждено: переднее левое / водительское, `1=закрыто`, `3=частично открыто`, `2=полностью открыто`. Позиции `2210002..2210004` закрепляются отдельным marker-тестом.', 'Физическая привязка окон теперь подтверждена marker-тестом: `2210001=переднее левое/водительское`, `2210002=переднее правое`, `2210003=заднее левое`, `2210004=заднее правое`. Для `2210001` отдельно пойманы `1=закрыто`, `3=частично`, `2=полностью открыто`; для `2210002..2210004` в recovered run надёжно пойманы `1=закрыто` и `2=полностью открыто`, а `3` не успело попасть в отдельный poll.')
          prepend_after('README.md', '/config/gwm_jolion_protocol_capture/gwm_code_search_*.jsonl\n```\n', '\nПри каждом setup/reload с включённым capture создаётся новый timestamped JSONL-файл. **Обновление или перезагрузка интеграции не удаляет старые capture-файлы**. Стандартная диагностика экспортирует текущую активную сессию, а предыдущие тесты можно забрать напрямую из этого каталога.\n')

          changelog = '''\n## 0.1.0-alpha.19.7\n\nПолевой protocol-релиз по восстановленной JSONL-сессии `alpha.19.5` с 68 записями и marker-тестами.\n\n### Confirmed telemetry\n\n- физически закреплены все четыре окна: `2210001=FL`, `2210002=FR`, `2210003=RL`, `2210004=RR`;\n- для FL подтверждена шкала `1=closed`, `3=partial`, `2=full open`; для FR/RL/RR надёжно пойманы `1=closed` и `2=full open`, поэтому generic decoder сохраняет консервативное `2/3=not closed`;\n- `2202001` переведён в confirmed climate state: `0=OFF`, `1=ON`;\n- marker ACC подтвердил, что `2016001` остаётся `0` в ACC, а RUNNING даёт `0→2`, STOPPED — `2→0`; отдельный ACC signal не найден;\n- `2204008` повышен из unknown в `known_unverified` как кандидат дальнего света: после `LIGHT_HIGH` пойман `0→1`, затем возврат `1→0`;\n- быстрые steering/rear/front-defrost маркеры не выявили отдельных live status-кодов в 43-item STATUS; front defrost активирует общий climate code и не используется как отдельный status.\n\n### Home Assistant / remote card\n\n- raw telemetry `2210001..2210004` теперь создаёт diagnostic sensors с физическими friendly names;\n- существующие window binary-sensor unique IDs сохранены, их названия заменены на физические позиции;\n- remote-card обнаруживает raw/binary entities всех четырёх окон и анимирует соответствующие стёкла отдельно;\n- фары по-прежнему не активируются по engine и не включаются по кандидату `2204008` до повторного light-test;\n- frontend cache key и версия обновлены до `0.1.0-alpha.19.7`.\n\n### Capture recovery\n\n- README уточняет, что новый setup/reload создаёт новый timestamped JSONL, но старые capture-файлы в `/config/gwm_jolion_protocol_capture/` не удаляются; стандартная диагностика показывает текущую активную сессию.\n\n'''
          prepend_after('CHANGELOG.md', '# Changelog\n', changelog)

