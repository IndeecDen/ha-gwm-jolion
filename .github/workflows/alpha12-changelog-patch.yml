name: Alpha 12 changelog patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          section = """## 0.1.0-alpha.12

Ручная настройка опционального оборудования по комплектации автомобиля.

### Комплектация

- в настройках интеграции добавлены переключатели панорамы и шторки, обогрева руля, заднего и переднего defrost, электрообогрева лобового, подогрева передних сидений, Cabin Clean и очистителя воздуха;
- прежнее поведение сохраняется до первого изменения настроек: все ранее доступные функции считаются включёнными;
- `vehicleBasicsInfo` не используется как доказательство наличия оборудования, поскольку GWM возвращает универсальный шаблон даже для отсутствующих узлов;
- отключённые optional button/sensor/binary_sensor не загружаются как активные сущности;
- добавлен диагностический сенсор `Оборудование автомобиля` с текущими capability-флагами.

### Карточка / безопасность

- карточка скрывает панораму, шторку и comfort-функции, отключённые в настройках интеграции;
- backend блокирует remote-команды для оборудования, которое пользователь отметил как отсутствующее;
- добавлены unit-тесты ручных capability-настроек и сопоставления команд/состояний;
- новых GWM remote payload в этой версии нет.

"""
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("CHANGELOG header not found")
          if "## 0.1.0-alpha.12" not in text:
              text = text.replace(marker, marker + section, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changelog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha12-changelog-patch.yml
          git add CHANGELOG.md
          git commit -m "Document alpha.12 equipment capabilities"
          git push
