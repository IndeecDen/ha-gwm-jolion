name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Compile integration
        run: python -m compileall -q custom_components/gwm_jolion
      - name: Validate bundled card JavaScript
        run: node --check custom_components/gwm_jolion/frontend/gwm-jolion-card.js
      - name: Validate JSON and YAML files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in [Path('custom_components/gwm_jolion/services.yaml')]:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('JSON/YAML validation passed')
          PY
      - name: Run protocol unit tests
        run: pytest -q tests
