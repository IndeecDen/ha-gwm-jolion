name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check pytest PyYAML aiohttp voluptuous tzdata cryptography awesomeversion pyflakes
      - name: Compile integration
        run: python -m compileall -q custom_components/gwm_jolion
      - name: Reject names that are used but never imported
        run: python tools/check_names.py
      - name: Validate bundled card JavaScript
        shell: bash
        run: |
          for card in custom_components/gwm_jolion/frontend/*.js; do
            echo "Checking $card"
            node --check "$card"
          done
      - name: Validate JSON and YAML files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in [Path('custom_components/gwm_jolion/services.yaml')]:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print('JSON/YAML validation passed')
          PY
      - name: Reject a manifest version Home Assistant would block
        run: python tools/check_version.py
      - name: Run protocol unit tests
        run: pytest -q tests

  ha-setup:
    # HA is a Linux runtime. Missing dependencies/skipped tests fail this job.
    runs-on: ubuntu-latest
    env:
      GWM_HA_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the Home Assistant test harness
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r tests/ha/requirements.txt
      - name: Load the config entry for real
        run: pytest -q tests/ha -o asyncio_mode=auto

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run bundled card browser checks
        run: npm run test:browser
