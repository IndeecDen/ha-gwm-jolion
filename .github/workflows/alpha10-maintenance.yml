name: Alpha 10 maintenance patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alpha10-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply alpha.10 reliability changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}\n--- old ---\n{old}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # coordinator.py: conservative command guards, monotonic cooldown and clearer state.
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              "from homeassistant.exceptions import HomeAssistantError\n",
              "from homeassistant.exceptions import ConfigEntryAuthFailed, HomeAssistantError\n",
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              "from .api import GwmJolionApiClient\nfrom .capabilities import capability_report\n",
              "from .api import GwmJolionApiClient, GwmJolionApiError\nfrom .capabilities import capability_report\nfrom .command_safety import remote_start_block_reason\n",
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              "    node[path[-1]] = value\n\n\nclass GwmJolionCoordinator",
              '''    node[path[-1]] = value\n\n\ndef _friendly_remote_error(err: Exception) -> str:\n    """Return a concise user-facing command error without hiding GWM details."""\n    if isinstance(err, GwmJolionApiError):\n        if err.code == "timeout":\n            return "GWM не подтвердил выполнение команды за 300 секунд"\n        if err.code:\n            return f"{err} (код GWM {err.code})"\n    text = str(err).strip()\n    return text or "Неизвестная ошибка удалённой команды"\n\n\nclass GwmJolionCoordinator''',
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              "        self.last_command_name: str | None = None\n        self.last_command_result_code: str | None = None\n",
              "        self.last_command_name: str | None = None\n        self.last_command_status: str | None = None\n        self.last_command_result_code: str | None = None\n",
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              '''    def _ensure_remote_ready(self) -> str:\n        if not self.enable_remote_controls:\n            raise HomeAssistantError("Remote controls are disabled in GWM Jolion options")\n        if not self.security_pin:\n            raise HomeAssistantError("Security PIN is required in GWM Jolion options")\n        elapsed = time.time() - self._last_command_time\n        if elapsed < self.command_cooldown:\n            remaining = max(1, int(self.command_cooldown - elapsed))\n            raise HomeAssistantError(f"Command cooldown active. Wait {remaining} seconds.")\n        vin = (self.data or {}).get("vin")\n        if not vin:\n            raise HomeAssistantError("Vehicle VIN is not available")\n        return str(vin)\n''',
              '''    def _ensure_remote_ready(self) -> str:\n        if not self.enable_remote_controls:\n            raise HomeAssistantError("Удалённое управление отключено в настройках GWM Jolion")\n        if not self.security_pin:\n            raise HomeAssistantError("Для удалённой команды требуется PIN безопасности GWM")\n        elapsed = time.monotonic() - self._last_command_time\n        if elapsed < self.command_cooldown:\n            remaining = max(1, int(self.command_cooldown - elapsed))\n            raise HomeAssistantError(f"Подождите ещё {remaining} сек. перед следующей командой")\n        vin = (self.data or {}).get("vin")\n        if not vin:\n            raise HomeAssistantError("VIN автомобиля пока недоступен. Обновите данные GWM")\n        return str(vin)\n''',
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              '''    async def async_send_custom_t5(\n        self,\n        *,\n        name: str,\n        instructions: dict[str, Any],\n        expected_remote_type: str,\n    ) -> dict[str, Any]:\n        if self._command_lock.locked():\n            raise HomeAssistantError("Another GWM remote command is already in progress")\n\n        async with self._command_lock:\n            vin = self._ensure_remote_ready()\n            self._last_command_time = time.time()\n            self.last_command_name = name\n            self.last_command_result_code = "pending"\n            self.last_command_result_message = ""\n            self.last_command_at = datetime.now(timezone.utc)\n            self.async_update_listeners()\n            try:\n                result = await self.client.async_send_t5_command(\n                    vin,\n                    instructions,\n                    expected_remote_type,\n                    security_pin=self.security_pin,\n                )\n            except Exception as err:\n                self.last_command_result_code = "error"\n                self.last_command_result_message = str(err)\n                self.async_update_listeners()\n                raise\n\n            self.last_command_result_code = str(result.get("resultCode", ""))\n            self.last_command_result_message = str(result.get("resultMsg") or "")\n            self.async_update_listeners()\n            await self.async_request_refresh()\n            return result\n''',
              '''    async def async_send_custom_t5(\n        self,\n        *,\n        name: str,\n        instructions: dict[str, Any],\n        expected_remote_type: str,\n        command_key: str | None = None,\n    ) -> dict[str, Any]:\n        if self._command_lock.locked():\n            raise HomeAssistantError("Другая удалённая команда GWM уже выполняется")\n\n        async with self._command_lock:\n            if command_key == "start_engine":\n                # Use fresh cloud telemetry for the conservative start guard.\n                await self.async_request_refresh()\n                reason = remote_start_block_reason((self.data or {}).get("state") or {})\n                if reason:\n                    raise HomeAssistantError(\n                        f"Удалённый запуск отменён: {reason}. Обновите состояние автомобиля, если оно изменилось"\n                    )\n\n            vin = self._ensure_remote_ready()\n            self._last_command_time = time.monotonic()\n            self.last_command_name = name\n            self.last_command_status = "pending"\n            self.last_command_result_code = None\n            self.last_command_result_message = "Команда отправлена в GWM"\n            self.last_command_at = datetime.now(timezone.utc)\n            self.async_update_listeners()\n            try:\n                result = await self.client.async_send_t5_command(\n                    vin,\n                    instructions,\n                    expected_remote_type,\n                    security_pin=self.security_pin,\n                )\n            except Exception as err:\n                self.last_command_status = "error"\n                error_code = getattr(err, "code", None)\n                self.last_command_result_code = str(error_code) if error_code else "error"\n                self.last_command_result_message = _friendly_remote_error(err)\n                self.async_update_listeners()\n                raise\n\n            self.last_command_status = "success"\n            self.last_command_result_code = str(result.get("resultCode", ""))\n            self.last_command_result_message = str(result.get("resultMsg") or "Команда выполнена")\n            self.async_update_listeners()\n            try:\n                await self.async_request_refresh()\n            except ConfigEntryAuthFailed:\n                raise\n            except Exception as err:\n                _LOGGER.debug("Post-command refresh failed after successful command: %s", err)\n            return result\n''',
          )
          replace(
              "custom_components/gwm_jolion/coordinator.py",
              '''        if operation_time is not None and path:\n            if not 1 <= int(operation_time) <= 30:\n                raise HomeAssistantError("operation_time must be between 1 and 30")\n            _set_nested(instructions, tuple(path), str(int(operation_time)))\n        return await self.async_send_custom_t5(\n            name=command["name"],\n            instructions=instructions,\n            expected_remote_type=command["expected_remote_type"],\n        )\n''',
              '''        if operation_time is not None and path:\n            if not 1 <= int(operation_time) <= 30:\n                raise HomeAssistantError("Время работы команды должно быть от 1 до 30 минут")\n            _set_nested(instructions, tuple(path), str(int(operation_time)))\n        return await self.async_send_custom_t5(\n            name=command["name"],\n            instructions=instructions,\n            expected_remote_type=command["expected_remote_type"],\n            command_key=command_key,\n        )\n''',
          )

          # api.py: turn persistent auth failures into ConfigEntryAuthFailed and keep result codes.
          replace(
              "custom_components/gwm_jolion/api.py",
              "from .helpers import build_state, normalize_phone, redact_vehicle, vehicle_basics_snapshot\n",
              "from .command_safety import is_auth_error_code\nfrom .helpers import build_state, normalize_phone, redact_vehicle, vehicle_basics_snapshot\n",
          )
          replace(
              "custom_components/gwm_jolion/api.py",
              '''        if last_error_code:\n            raise HomeAssistantError(\n                f"Command failed: {last_error_msg}" if last_error_msg else f"Error code {last_error_code}"\n            )\n        raise HomeAssistantError("Command timed out after 300 seconds")\n''',
              '''        if last_error_code:\n            raise GwmJolionApiError(\n                f"Команда GWM завершилась с ошибкой: {last_error_msg}"\n                if last_error_msg\n                else f"Команда GWM завершилась с кодом {last_error_code}",\n                code=last_error_code,\n            )\n        raise GwmJolionApiError(\n            "GWM не подтвердил выполнение команды за 300 секунд",\n            code="timeout",\n        )\n''',
          )
          replace(
              "custom_components/gwm_jolion/api.py",
              '''        if with_token and retry_auth and code in {"401", "401000", "308001", "308002", "308003"}:\n            self._access_token = None\n            await self.async_login()\n            return await self._request(\n                method,\n                path,\n                params=params,\n                body=body,\n                with_token=with_token,\n                vin_header=vin_header,\n                retry_auth=False,\n            )\n        description = str(payload.get("description") or payload.get("message") or code)\n        _LOGGER.debug("GWM error: code=%s description=%s path=%s", code, description, path)\n        if not with_token:\n            raise ConfigEntryAuthFailed(description)\n        raise GwmJolionApiError(description, code=code)\n''',
              '''        if with_token and is_auth_error_code(code):\n            if retry_auth:\n                self._access_token = None\n                await self.async_login()\n                return await self._request(\n                    method,\n                    path,\n                    params=params,\n                    body=body,\n                    with_token=with_token,\n                    vin_header=vin_header,\n                    retry_auth=False,\n                )\n            description = str(payload.get("description") or payload.get("message") or code)\n            raise ConfigEntryAuthFailed(description)\n        description = str(payload.get("description") or payload.get("message") or code)\n        _LOGGER.debug("GWM error: code=%s description=%s path=%s", code, description, path)\n        if not with_token:\n            raise ConfigEntryAuthFailed(description)\n        raise GwmJolionApiError(description, code=code)\n''',
          )

          # config_flow.py: keep the existing GWM device id during reauthentication.
          replace(
              "custom_components/gwm_jolion/config_flow.py",
              "    device_id = uuid4().hex\n",
              "    device_id = str(data.get(CONF_DEVICE_ID) or uuid4().hex)\n",
          )

          # sensor.py: expose stable pending/success/error semantics to HA and the card.
          replace(
              "custom_components/gwm_jolion/sensor.py",
              '''    @property\n    def native_value(self) -> str | None:\n        if self.coordinator.last_command_name is None:\n            return None\n        code = self.coordinator.last_command_result_code\n        return self.coordinator.last_command_name if not code else f"{self.coordinator.last_command_name} [{code}]"\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return {\n            "result_code": self.coordinator.last_command_result_code,\n            "result_message": self.coordinator.last_command_result_message,\n            "in_progress": self.coordinator.command_in_progress,\n        }\n''',
              '''    @property\n    def native_value(self) -> str | None:\n        name = self.coordinator.last_command_name\n        if name is None:\n            return None\n        status = self.coordinator.last_command_status\n        suffix = {\n            "pending": "выполняется",\n            "success": "выполнено",\n            "error": "ошибка",\n        }.get(status)\n        return name if not suffix else f"{name} — {suffix}"\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        return {\n            "status": self.coordinator.last_command_status,\n            "result_code": self.coordinator.last_command_result_code,\n            "result_message": self.coordinator.last_command_result_message,\n            "in_progress": self.coordinator.command_in_progress,\n        }\n''',
          )

          # Card: global busy state while a T5 command is pending + local start guard.
          replace(
              "custom_components/gwm_jolion/frontend/gwm-jolion-card.js",
              "/* GWM Jolion Card v0.1.0-alpha.9 */\n(() => {\n  const CARD_VERSION = \"0.1.0-alpha.9\";",
              "/* GWM Jolion Card v0.1.0-alpha.10 */\n(() => {\n  const CARD_VERSION = \"0.1.0-alpha.10\";",
          )
          replace(
              "custom_components/gwm_jolion/frontend/gwm-jolion-card.js",
              '''    _isUnavailable(key) {\n      const state = this._state(key)?.state;\n      return !state || state === "unknown" || state === "unavailable";\n    }\n\n    _featureOn(key) {''',
              '''    _isUnavailable(key) {\n      const state = this._state(key)?.state;\n      return !state || state === "unknown" || state === "unavailable";\n    }\n\n    _remoteCommandInProgress() {\n      const state = this._state("lastCommand");\n      return Boolean(\n        state?.attributes?.in_progress || state?.attributes?.status === "pending"\n      );\n    }\n\n    _isRemoteAction(id) {\n      return id !== "refresh" && !String(id).startsWith("readonly-");\n    }\n\n    _featureOn(key) {''',
          )
          replace(
              "custom_components/gwm_jolion/frontend/gwm-jolion-card.js",
              '''    _control(id, icon, title, subtitle, tone = "", disabled = false) {\n      return `\n        <button\n          class="control ${tone} ${this._busy.has(id) ? "busy" : ""} ${disabled ? "disabled" : ""}"\n          ${disabled ? "disabled" : `data-action="${id}"`}\n          type="button"\n        >\n          ${this._icon(icon)}\n          <span class="control-copy">\n            <strong>${this._escape(title)}</strong>\n            <small>${this._escape(subtitle)}</small>\n          </span>\n        </button>`;\n    }\n''',
              '''    _control(id, icon, title, subtitle, tone = "", disabled = false) {\n      const remoteBusy =\n        this._remoteCommandInProgress() && this._isRemoteAction(id);\n      const effectiveDisabled = disabled || remoteBusy;\n      const busy = this._busy.has(id) || remoteBusy;\n      const visibleSubtitle = remoteBusy\n        ? "Выполняется удалённая команда…"\n        : subtitle;\n      return `\n        <button\n          class="control ${tone} ${busy ? "busy" : ""} ${effectiveDisabled ? "disabled" : ""}"\n          ${effectiveDisabled ? "disabled" : `data-action="${id}"`}\n          type="button"\n        >\n          ${this._icon(icon)}\n          <span class="control-copy">\n            <strong>${this._escape(title)}</strong>\n            <small>${this._escape(visibleSubtitle)}</small>\n          </span>\n        </button>`;\n    }\n''',
          )
          replace(
              "custom_components/gwm_jolion/frontend/gwm-jolion-card.js",
              '''      if (action === "engine") {\n        const runtime = Math.min(\n          30,\n          Math.max(5, Number(this._engineRuntime) || 15)\n        );\n        const message = engineOn\n          ? "Остановить двигатель?"\n          : `Запустить двигатель на ${runtime} мин? Машина должна быть закрыта.`;\n''',
              '''      if (action === "engine") {\n        const runtime = Math.min(\n          30,\n          Math.max(5, Number(this._engineRuntime) || 15)\n        );\n        if (!engineOn) {\n          const blockers = [];\n          if (unlocked) blockers.push("автомобиль не закрыт");\n          if (this._isOn("doors")) blockers.push("открыта дверь");\n          if (trunkOpen) blockers.push("открыт багажник");\n          if (blockers.length) {\n            alert(\n              `GWM Jolion: запуск сейчас недоступен — ${blockers.join(", ")}. Обновите данные после изменения состояния автомобиля.`\n            );\n            return;\n          }\n        }\n        const message = engineOn\n          ? "Остановить двигатель?"\n          : `Запустить двигатель на ${runtime} мин? Перед отправкой интеграция ещё раз проверит состояние автомобиля.`;\n''',
          )

          # Version constants/cache busting. Manifest is intentionally bumped later
          # by a user-originated commit so validation and release workflows run.
          replace(
              "custom_components/gwm_jolion/const.py",
              'VERSION = "0.1.0-alpha.9"',
              'VERSION = "0.1.0-alpha.10"',
          )
          replace(
              "custom_components/gwm_jolion/__init__.py",
              'FRONTEND_URL = "/gwm-jolion/gwm-jolion-card.js?v=0.1.0-alpha.9"',
              'FRONTEND_URL = "/gwm-jolion/gwm-jolion-card.js?v=0.1.0-alpha.10"',
          )

          # Changelog: concise release notes, no new vehicle payloads.
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("CHANGELOG.md: unexpected header")
          section = '''## 0.1.0-alpha.10\n\nРелиз надёжности без добавления новых неподтверждённых команд автомобиля.\n\n### Надёжность\n\n- удалённые T5-команды остаются строго последовательными: новая команда не принимается, пока предыдущая выполняется;\n- cooldown переведён на монотонный таймер;\n- перед удалённым запуском двигателя выполняется свежий опрос GWM и проверяются подтверждённые состояния: двигатель, центральный замок, двери и багажник;\n- постоянная ошибка авторизации после автоматического повторного входа переводит интеграцию в Home Assistant reauth;\n- повторная авторизация сохраняет существующий GWM device ID;\n- ошибки результата T5 сохраняют код GWM, а timeout имеет отдельный диагностический код.\n\n### Home Assistant / карточка\n\n- сенсор последней команды использует состояния `выполняется`, `выполнено`, `ошибка` и публикует атрибут `status`;\n- пока T5-команда выполняется, остальные удалённые кнопки карточки временно блокируются;\n- карточка предварительно предупреждает о видимых препятствиях для запуска двигателя;\n- новых remote payload в этой версии нет.\n\n'''
          if "## 0.1.0-alpha.10" not in text:
              p.write_text(marker + section + text[len(marker):], encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha10-maintenance.yml
          git add custom_components tests CHANGELOG.md
          git commit -m "Prepare 0.1.0-alpha.10 reliability changes"
          git push
