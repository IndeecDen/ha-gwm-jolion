name: Alpha 16 version sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/alpha16-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync internal versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('custom_components/gwm_jolion/const.py'): [('VERSION = "0.1.0-alpha.14"', 'VERSION = "0.1.0-alpha.16"'), ('VERSION = "0.1.0-alpha.15"', 'VERSION = "0.1.0-alpha.16"')],
              Path('custom_components/gwm_jolion/frontend/gwm-jolion-card.js'): [('0.1.0-alpha.14', '0.1.0-alpha.16'), ('0.1.0-alpha.15', '0.1.0-alpha.16')],
              Path('custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js'): [('0.1.0-alpha.14', '0.1.0-alpha.16'), ('0.1.0-alpha.15', '0.1.0-alpha.16')],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/alpha16-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/gwm_jolion/const.py custom_components/gwm_jolion/frontend/gwm-jolion-card.js custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js
          git commit -m "Sync alpha.16 frontend and backend versions"
          git push