name: Alpha 17 editor fix

on:
  push:
    paths:
      - .github/workflows/alpha17-editor-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix primary card editor registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          card_path = Path('custom_components/gwm_jolion/frontend/gwm-jolion-card.js')
          card = card_path.read_text(encoding='utf-8')
          card = card.replace('0.1.0-alpha.16', '0.1.0-alpha.17')
          old = '''    static getStubConfig() {
              return {};
            }

            static getGridOptions() {'''.replace('              ', '')
          new = '''    static getStubConfig() {
              return {};
            }

            static getConfigElement() {
              return document.createElement("gwm-jolion-card-editor");
            }

            static getGridOptions() {'''.replace('              ', '')
          if old not in card:
              raise SystemExit('primary card getStubConfig anchor not found')
          card = card.replace(old, new, 1)
          card_path.write_text(card, encoding='utf-8')

          editor_path = Path('custom_components/gwm_jolion/frontend/gwm-jolion-card-editor.js')
          editor = editor_path.read_text(encoding='utf-8')
          editor = editor.replace('0.1.0-alpha.16', '0.1.0-alpha.17')
          old = '''  const Card = customElements.get("gwm-jolion-card");
            if (!Card) {
              console.error("[GWM Jolion Card Editor] gwm-jolion-card is not registered");
              return;
            }

            Card.getConfigElement = () => document.createElement("gwm-jolion-card-editor");
            Card.getStubConfig = () => ({
              controls: [...DEFAULT_CONTROLS],
              info: [...DEFAULT_INFO],
              details: [...DEFAULT_DETAILS],
            });

            const originalRender = Card.prototype._render;
            if (!Card.prototype._gwmVisualEditorPatched) {
              Card.prototype._render = function patchedRender(...args) {
                const result = originalRender.apply(this, args);
                try {
                  applyVisibility(this);
                } catch (err) {
                  console.error("[GWM Jolion Card Editor] visibility update failed", err);
                }
                return result;
              };
              Card.prototype._gwmVisualEditorPatched = true;
            }
'''.replace('            ', '')
          new = '''  function patchCard(Card) {
              Card.getConfigElement = () => document.createElement("gwm-jolion-card-editor");
              Card.getStubConfig = () => ({
                controls: [...DEFAULT_CONTROLS],
                info: [...DEFAULT_INFO],
                details: [...DEFAULT_DETAILS],
              });

              if (!Card.prototype._gwmVisualEditorPatched) {
                const originalRender = Card.prototype._render;
                Card.prototype._render = function patchedRender(...args) {
                  const result = originalRender.apply(this, args);
                  try {
                    applyVisibility(this);
                  } catch (err) {
                    console.error("[GWM Jolion Card Editor] visibility update failed", err);
                  }
                  return result;
                };
                Card.prototype._gwmVisualEditorPatched = true;
              }
            }

            const existingCard = customElements.get("gwm-jolion-card");
            if (existingCard) {
              patchCard(existingCard);
            } else {
              customElements.whenDefined("gwm-jolion-card")
                .then(() => {
                  const Card = customElements.get("gwm-jolion-card");
                  if (Card) patchCard(Card);
                })
                .catch((err) => {
                  console.error("[GWM Jolion Card Editor] card registration wait failed", err);
                });
            }
'''.replace('            ', '')
          if old not in editor:
              raise SystemExit('editor immediate-registration block not found')
          editor = editor.replace(old, new, 1)
          editor_path.write_text(editor, encoding='utf-8')

          for filename in [
              'custom_components/gwm_jolion/frontend/gwm-jolion-remote-card.js',
              'custom_components/gwm_jolion/__init__.py',
              'custom_components/gwm_jolion/const.py',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8').replace('0.1.0-alpha.16', '0.1.0-alpha.17')
              path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Текущая версия — **0.1.0-alpha.16**.', 'Текущая версия — **0.1.0-alpha.17**.')
          anchor = 'Начиная с `0.1.0-alpha.16` у основной карточки есть собственный **визуальный редактор Home Assistant**. В нём можно без YAML выбрать, какие кнопки и данные показывать. Доступен выбор двигателя, замка, багажника, окон, климата, обновления, comfort-функций, топлива, запаса хода, пробега, шин, T-Box, GSM, GPS, масла, последней команды, времени обновления и статусов подогревов. Отдельно можно включать или скрывать таймер двигателя, температуру и таймер климата.\n'
          note = '\nВ `0.1.0-alpha.17` исправлена регистрация редактора: карточка объявляет поддержку visual editor сама, а editor-модуль больше не зависит от порядка загрузки frontend-ресурсов Home Assistant.\n'
          if anchor in readme and note.strip() not in readme:
              readme = readme.replace(anchor, anchor + note, 1)
          readme_path.write_text(readme, encoding='utf-8')

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          marker = '- ✅ visual editor для основной карточки;'
          if marker in roadmap and 'регистрация visual editor не зависит от порядка загрузки frontend-ресурсов' not in roadmap:
              roadmap = roadmap.replace(marker, marker + '\n- ✅ регистрация visual editor не зависит от порядка загрузки frontend-ресурсов;', 1)
          version_marker = '## 10. Версии\n'
          release_note = '''\n### `0.1.0-alpha.17` — Primary card editor registration fix\n\nИсправлена регистрация visual editor основной карточки: `getConfigElement()` теперь объявлен непосредственно в `gwm-jolion-card`, а отдельный editor-модуль использует `customElements.whenDefined()` и больше не зависит от порядка загрузки extra JS ресурсов Home Assistant.\n'''
          if version_marker in roadmap and '`0.1.0-alpha.17`' not in roadmap:
              roadmap = roadmap.replace(version_marker, version_marker + release_note, 1)
          roadmap_path.write_text(roadmap, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          release = '''## 0.1.0-alpha.17\n\nИсправлена регистрация визуального редактора основной карточки `custom:gwm-jolion-card`.\n\n- `getConfigElement()` теперь объявлен непосредственно классом основной карточки;\n- editor-модуль ожидает регистрацию карточки через `customElements.whenDefined()` и не зависит от порядка загрузки frontend-ресурсов;\n- обновлён cache-busting всех встроенных карточек;\n- remote-команды и GWM payload не изменялись.\n\n'''
          if '## 0.1.0-alpha.17' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + release, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          Path('.github/workflows/alpha17-editor-fix.yml').unlink()
          PY

          git config user.name "IndeecDen"
          git config user.email "60156503+IndeecDen@users.noreply.github.com"
          git add -A
          git commit -m "Prepare 0.1.0-alpha.17 editor fix"
          git push

# second commit activates this newly-added workflow
