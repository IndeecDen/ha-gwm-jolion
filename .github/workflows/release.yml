name: Version release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve manifest version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/gwm_jolion/manifest.json').read_text(encoding='utf-8'))
          print(manifest['version'])
          PY
          )"
          MESSAGE="$(git log -1 --pretty=%s)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$MESSAGE" == "$VERSION"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release and tag
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          python - "$VERSION" <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          heading = f'## {version}\n'
          if heading not in changelog:
              raise SystemExit(f'Missing changelog section for {version}')
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          Path('release-notes.md').write_text(notes + '\n', encoding='utf-8')
          PY
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md
