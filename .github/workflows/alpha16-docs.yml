name: Alpha 16 docs sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/alpha16-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update roadmap and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('- ⏳ visual editor для основной карточки;', '- ✅ visual editor для основной карточки с выбором кнопок, датчиков и дополнительных панелей;')
          marker = '## 10. Версии\n\n'
          entry = '''### `0.1.0-alpha.16` — Primary card visual editor\n\nОсновная `custom:gwm-jolion-card` получила visual editor Home Assistant. Пользователь может выбирать кнопки управления, датчики/информацию и дополнительные панели без ручного YAML. Старые карточки сохраняют прежний полный набор элементов, а capability-настройки комплектации по-прежнему имеют приоритет. Новых GWM payload нет.\n\n'''
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          roadmap.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 0.1.0-alpha.16\n\nДобавлен визуальный редактор основной Lovelace-карточки `custom:gwm-jolion-card`.\n\n### Основная карточка\n\n- можно выбирать отображаемые кнопки: двигатель, замок, багажник, окна, климат, обновление и доступные comfort-функции;\n- можно выбирать информационные элементы: топливо, запас хода, пробег, предупреждения, шины, T-Box, GSM, GPS, масло, последнюю команду, время обновления и статусы подогревов;\n- отдельно настраиваются таймер двигателя, температура и таймер климата;\n- существующие карточки без новых параметров сохраняют прежний полный набор элементов;\n- настройки комплектации интеграции имеют приоритет над настройками карточки;\n- frontend editor поставляется отдельным модулем, код remote-команд не менялся;\n- новых GWM remote payload нет.\n\n'''
          if entry not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/alpha16-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md CHANGELOG.md
          git commit -m "Update alpha.16 roadmap and changelog"
          git push