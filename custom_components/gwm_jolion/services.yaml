start_engine:
  fields:
    operation_time:
      required: false
      example: 15
      selector:
        number:
          min: 5
          max: 30
          step: 1
          mode: box
          unit_of_measurement: min
stop_engine: {}
flash_lights: {}
horn: {}
flash_and_horn: {}
unlock_vehicle: {}
lock_vehicle: {}
open_trunk: {}
close_trunk: {}
close_windows: {}
open_windows: {}
close_sunroof: {}
open_sunroof: {}
open_sunshade: {}
close_sunshade: {}
rear_defrost_on:
  fields:
    operation_time:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: box
          unit_of_measurement: min
rear_defrost_off: {}
steering_wheel_heat_on:
  fields:
    operation_time:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: box
          unit_of_measurement: min
steering_wheel_heat_off: {}
front_defrost_on: {}
front_defrost_off: {}
cabin_clean: {}
add_capture_marker:
  fields:
    label:
      required: true
      example: DRIVER_SEAT_L3
      selector:
        text:
          multiline: false

set_seat_heating:
  name: Подогрев сидений
  description: Уровни передних сидений и таймер. Ноль выключает выбранное сиденье. Команда ещё не проверена на автомобиле.
  fields:
    entry_id:
      description: ID записи интеграции; обязателен при нескольких автомобилях.
      selector:
        text:
    driver:
      name: Сиденье водителя
      selector:
        number:
          min: 0
          max: 3
          step: 1
    passenger:
      name: Сиденье пассажира
      selector:
        number:
          min: 0
          max: 3
          step: 1
    operation_time:
      name: Время подогрева
      default: 5
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: min
